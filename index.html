<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shane's Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <header class="brand">
            <img src="logo_20260927_211056_0000.jpg" alt="Shane's Calculator crocodile logo" class="logo">

            <div class="brand-info">
                <h1>Shane's Calculator</h1>
                <p>CLASSIC • CLEAN • PRECISE</p>
            </div>
        </header>


        <section class="calculator">

            <!-- Display -->
            <div class="display" aria-live="polite">
                <div id="expression" class="expression"></div>
                <div id="result" class="result">0</div>
            </div>


            <!-- Calculator buttons -->
            <div class="buttons">

                <button class="button utility" data-action="clear">
                    AC
                </button>

                <button class="button utility" data-action="backspace">
                    ⌫
                </button>

                <button class="button utility" data-action="percent">
                    %
                </button>

                <button class="button operator" data-value="÷">
                    ÷
                </button>


                <button class="button" data-value="7">
                    7
                </button>

                <button class="button" data-value="8">
                    8
                </button>

                <button class="button" data-value="9">
                    9
                </button>

                <button class="button operator" data-value="×">
                    ×
                </button>


                <button class="button" data-value="4">
                    4
                </button>

                <button class="button" data-value="5">
                    5
                </button>

                <button class="button" data-value="6">
                    6
                </button>

                <button class="button operator" data-value="−">
                    −
                </button>


                <button class="button" data-value="1">
                    1
                </button>

                <button class="button" data-value="2">
                    2
                </button>

                <button class="button" data-value="3">
                    3
                </button>

                <button class="button operator" data-value="+">
                    +
                </button>


                <button class="button zero" data-value="0">
                    0
                </button>

                <button class="button" data-value=".">
                    .
                </button>

                <button class="button equals" data-action="equals">
                    =
                </button>

            </div>


            <footer class="calculator-footer">
                <span>
                    <span class="status-dot"></span>
                    Shane's Calculator
                </span>

                <span>V1.0</span>
            </footer>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
